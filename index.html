<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>黏黏五子棋</title>
    <link rel="stylesheet" href="style.css">
    <!-- 引入 PeerJS 用於 P2P 連線 -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- 引入 QRious 產生 QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <!-- 引入 Canvas Confetti 產生慶祝彩帶 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- 標題列 -->
        <header>
            <h1>黏黏五子棋 🍡</h1>
            <div id="status-bar">
                <span id="connection-status">🔴 尚未連線</span>
                <span id="turn-indicator">等待開始...</span>
            </div>
        </header>

        <!-- 連線面板 -->
        <div id="network-panel" class="panel">
            <h2>選擇遊戲模式</h2>
            <div class="network-controls">
                
                <!-- 單人/單機區 -->
                <div class="local-section">
                    <button id="ai-btn" style="background-color: #8e44ad; margin-bottom: 10px;">單人對戰 (打電腦)</button>
                    <div id="ai-difficulty-panel" class="hidden" style="margin-bottom: 15px;">
                        <button class="ai-diff-btn" data-level="easy" style="background-color: #2ecc71; width: 30%; font-size: 0.9rem;">簡單</button>
                        <button class="ai-diff-btn" data-level="medium" style="background-color: #f1c40f; color:#333; width: 30%; font-size: 0.9rem;">中等</button>
                        <button class="ai-diff-btn" data-level="hard" style="background-color: #e74c3c; width: 30%; font-size: 0.9rem;">困難</button>
                    </div>
                    <button id="local-btn" style="background-color: #2c3e50;">單機雙人 (同一台輪流)</button>
                </div>

                <div class="divider">網際網路連線對戰</div>

                <div class="host-section">
                    <p>分享給朋友連線：</p>
                    <canvas id="qr-code" style="margin: 10px auto; display: block;"></canvas>
                    <p>邀請碼：<strong id="my-peer-id">產生中...</strong></p>
                    <button id="copy-btn">複製邀請碼</button>
                </div>

                <div class="join-section">
                    <input type="text" id="friend-id-input" placeholder="貼上邀請碼">
                    <button id="join-btn">加入遊戲</button>
                </div>

            </div>
        </div>

        <!-- 遊戲主畫面 -->
        <div id="game-panel" class="panel hidden">
            <div class="player-info">
                <div id="player-black" class="player-box">
                    <div class="stone black"></div>
                    <span>黑方 (建房者)</span>
                </div>
                <div id="player-white" class="player-box">
                    <div class="stone white"></div>
                    <span>白方 (加入者)</span>
                </div>
            </div>

            <div class="board-container">
                <canvas id="go-board" width="400" height="400"></canvas>
            </div>
            
            <div class="controls">
                <button id="resign-btn" class="danger">認輸</button>
                <button id="menu-btn" style="background-color: #7f8c8d; display: none;">回主選單</button>
            </div>
        </div>
        
        <!-- 結算/提示彈窗 -->
        <div id="modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="modal-title">提示</h2>
                <p id="modal-message"></p>
                <button id="modal-close-btn">確定</button>
                <button id="modal-menu-btn" style="margin-top:10px; background-color: #95a5a6;">回主選單</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
    <script src="ai.js"></script>
    <script src="network.js"></script>
</body>
</html>
